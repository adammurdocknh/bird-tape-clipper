<!DOCTYPE html>

    </div>

    <div id="process" class="element knob knob-element" data-type="knob" data-parameter-id="PROCESS" data-value="0" data-start-angle="-135" data-end-angle="135" style="position: absolute; left: 300px; top: 200px; width: 200px; height: 200px; transform: rotate(0deg);">

      <span class="knob-value knob-value-top" style="font-size: 24px; color: #a0a0a0;">0%</span>

  <div class="track"></div>
  <div class="thumb"></div>
  
</div>
    <div id="timbre-tilt-slider" class="element slider slider-element crossfadeslider-element" data-type="crossfadeslider" data-parameter-id="TILT" data-value="0.5" style="position: absolute; left: 300px; top: 475px; width: 200px; height: 50px; transform: rotate(0deg);">
      
      
      <div class="crossfade-labels">
        <span class="label-a" style="color: #888888; font-size: 12px; font-family: Inter, system-ui, sans-serif; font-weight: 400;">Lo</span>
        <span class="label-b" style="color: #888888; font-size: 12px; font-family: Inter, system-ui, sans-serif; font-weight: 400;">Hi</span>
      </div>
      <div class="slider-track" style="background: #374151;"></div>
      <div class="slider-fill" style="width: 0%; left: 50%; background: #4b76a2;"></div>
      <div class="center-detent"></div>
      <div class="slider-thumb" style="left: 50%; background: #ffffff;"></div>
    </div>
    <span id="tilt-on-label" class="element label-element" data-type="label" style="position: absolute; left: 335px; top: 550px; width: 40px; height: 25px; transform: rotate(0deg); font-size: 14px; font-family: Inter, system-ui, sans-serif; font-weight: 400; color: #888888; text-align: center; display: flex; align-items: center; justify-content: center;">Off</span>

    <div id="brightness-switch" class="element rotaryswitch-element" data-type="rotaryswitch" data-parameter-id="BRIGHTNESS" data-position="0" data-count="3" data-layout="radial" style="position: absolute; left: 150px; top: 350px; width: 80px; height: 80px; transform: rotate(0deg);">

    <circle cx="40" cy="40" r="28" fill="#374151" stroke="#6b7280" stroke-width="2" />

    <line x1="24.443650813895953" y1="55.55634918610404" x2="21.61522368914976" y2="58.384776310850235" stroke="#ffffff" stroke-width="2" stroke-linecap="round" /><line x1="40" y1="18" x2="40" y2="14" stroke="#6b7280" stroke-width="2" stroke-linecap="round" /><line x1="55.55634918610404" y1="55.55634918610404" x2="58.38477631085024" y2="58.384776310850235" stroke="#6b7280" stroke-width="2" stroke-linecap="round" />

    <line x1="40" y1="40" x2="26.140707088743667" y2="53.85929291125633" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <!-- Center dot -->
    <circle cx="40" cy="40" r="4" fill="#ffffff" />

    <text x="6.058874503045715" y="73.94112549695427" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#888888" font-weight="bold" opacity="1">RGB</text><text x="40" y="-8" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#888888" font-weight="normal" opacity="0.6">AU</text><text x="73.94112549695429" y="73.94112549695427" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#888888" font-weight="normal" opacity="0.6">Blu</text>
  </svg>
</div>
    <span id="brightness-label" class="element label-element" data-type="label" style="position: absolute; left: 150px; top: 430px; width: 80px; height: 30px; transform: rotate(0deg); font-size: 14px; font-family: Inter, system-ui, sans-serif; font-weight: 400; color: #ffffff; text-align: center; display: flex; align-items: center; justify-content: center;">Brightness</span>
    <span id="timbre-tilt-label" class="element label-element" data-type="label" style="position: absolute; left: 325px; top: 450px; width: 150px; height: 25px; transform: rotate(0deg); font-size: 14px; font-family: Inter, system-ui, sans-serif; font-weight: 400; color: #ffffff; text-align: center; display: flex; align-items: center; justify-content: center;">Timbre Tilt</span>

  </svg>
</div>
    <span id="mode-label" class="element label-element" data-type="label" style="position: absolute; left: 150px; top: 280px; width: 80px; height: 30px; transform: rotate(0deg); font-size: 14px; font-family: Inter, system-ui, sans-serif; font-weight: 400; color: #ffffff; text-align: center; display: flex; align-items: center; justify-content: center;">Mode</span>

</button>
